<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F&A Outlet – Moda de qualidade com preço de outlet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --gold-light: #E8C97A;
      --gold-dim: #8B6F2E;
      --black: #0A0A0A;
      --dark: #111111;
      --dark2: #1A1A1A;
      --dark3: #222222;
      --white: #F5F0E8;
      --white-dim: rgba(245,240,232,0.6);
    }

    html, body {
      min-height: 100%;
      background: var(--black);
      font-family: 'Montserrat', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* Noise overlay for texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.5;
    }

    /* ── Card ── */
    .card {
      position: relative;
      width: 100%;
      max-width: 420px;
      background: linear-gradient(160deg, var(--dark2) 0%, var(--black) 60%, #0D0D0D 100%);
      border-radius: 24px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.25),
        0 30px 80px rgba(0,0,0,0.8),
        0 0 60px rgba(201,168,76,0.05);
      animation: cardReveal 0.9s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes cardReveal {
      from { opacity: 0; transform: translateY(32px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Gold border top ── */
    .card-border-top {
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), var(--gold), var(--gold-light), var(--gold), var(--gold-dim), transparent);
    }

    /* ── Decorative SVG arabescos ── */
    .arabesque {
      position: absolute;
      pointer-events: none;
      opacity: 0.08;
    }
    .arabesque-tl {
      top: 60px; left: -20px; width: 160px;
      transform: rotate(-15deg);
    }
    .arabesque-br {
      bottom: 60px; right: -20px; width: 160px;
      transform: rotate(165deg);
    }

    /* ── Header ── */
    .card-header {
      padding: 52px 32px 28px;
      text-align: center;
      position: relative;
    }

    .store-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.4rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      color: var(--gold);
      text-transform: uppercase;
      margin-bottom: 10px;
      text-shadow: 0 0 30px rgba(201,168,76,0.35);
      animation: logoGlow 3s ease-in-out infinite alternate;
    }

    @keyframes logoGlow {
      from { text-shadow: 0 0 20px rgba(201,168,76,0.2); }
      to   { text-shadow: 0 0 40px rgba(201,168,76,0.55); }
    }

    .tagline {
      font-size: 0.72rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      color: var(--gold-dim);
      text-transform: uppercase;
      margin-bottom: 0;
    }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 32px;
      margin: 4px 0 28px;
    }
    .divider-line {
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.35), transparent);
    }
    .divider-diamond {
      width: 6px; height: 6px;
      background: var(--gold);
      transform: rotate(45deg);
      box-shadow: 0 0 8px rgba(201,168,76,0.6);
    }

    /* ── Buttons ── */
    .buttons {
      padding: 0 28px 16px;
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 20px;
      border-radius: 12px;
      text-decoration: none;
      border: 1px solid rgba(201,168,76,0.18);
      background: rgba(255,255,255,0.03);
      color: var(--white);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.82rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      transition: all 0.28s cubic-bezier(0.22,1,0.36,1);
      position: relative;
      overflow: hidden;
      cursor: pointer;
      animation: btnReveal 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }

    .btn:nth-child(1) { animation-delay: 0.25s; }
    .btn:nth-child(2) { animation-delay: 0.38s; }
    .btn:nth-child(3) { animation-delay: 0.51s; }

    @keyframes btnReveal {
      from { opacity: 0; transform: translateX(-16px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(201,168,76,0.08) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.28s;
    }

    .btn:hover::before { opacity: 1; }
    .btn:hover {
      border-color: rgba(201,168,76,0.5);
      background: rgba(201,168,76,0.06);
      transform: translateX(4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(201,168,76,0.15);
      color: var(--white);
    }
    .btn:active { transform: translateX(2px) scale(0.99); }

    .btn-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: transform 0.28s;
    }
    .btn:hover .btn-icon { transform: scale(1.08); }

    .btn-icon svg { width: 20px; height: 20px; }

    /* Icon backgrounds */
    .btn-ig   .btn-icon { background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045); }
    .btn-wa   .btn-icon { background: linear-gradient(135deg, #128C7E, #25D366); }
    .btn-map  .btn-icon { background: linear-gradient(135deg, #C9A84C, #8B6F2E); }

    .btn-label { flex: 1; text-align: left; }
    .btn-label-title { display: block; font-weight: 600; font-size: 0.82rem; margin-bottom: 1px; }
    .btn-label-sub   { display: block; font-size: 0.68rem; font-weight: 300; color: var(--white-dim); letter-spacing: 0.04em; }

    .btn-arrow {
      color: var(--gold-dim);
      font-size: 1.1rem;
      transition: transform 0.28s, color 0.28s;
    }
    .btn:hover .btn-arrow { transform: translateX(3px); color: var(--gold); }

    /* ── Address ── */
    .address-block {
      margin: 8px 28px 0;
      padding: 16px 20px;
      border-radius: 12px;
      border: 1px solid rgba(201,168,76,0.12);
      background: rgba(255,255,255,0.02);
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: btnReveal 0.7s cubic-bezier(0.22,1,0.36,1) 0.62s both;
    }

    .address-icon {
      margin-top: 2px;
      flex-shrink: 0;
    }
    .address-icon svg { width: 15px; height: 15px; fill: var(--gold-dim); }

    .address-text {
      font-size: 0.73rem;
      color: var(--white-dim);
      line-height: 1.7;
      letter-spacing: 0.04em;
    }
    .address-text strong {
      color: var(--gold-dim);
      font-weight: 500;
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    /* ── Footer ── */
    .card-footer {
      padding: 20px 32px 28px;
      text-align: center;
      animation: btnReveal 0.7s cubic-bezier(0.22,1,0.36,1) 0.75s both;
    }

    .footer-ornament {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .footer-ornament-line {
      width: 50px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(201,168,76,0.3));
    }
    .footer-ornament-line:last-child {
      background: linear-gradient(90deg, rgba(201,168,76,0.3), transparent);
    }
    .footer-ornament-icon { color: var(--gold-dim); font-size: 0.7rem; letter-spacing: 4px; }

    .footer-copy {
      font-size: 0.62rem;
      color: rgba(201,168,76,0.35);
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    /* ── Border bottom ── */
    .card-border-bottom {
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
      opacity: 0.5;
    }

    /* ── Responsive ── */
    @media (max-width: 360px) {
      .card-header { padding: 36px 20px 20px; }
      .buttons { padding: 0 16px 12px; }
      .address-block { margin: 8px 16px 0; }
      .store-name { font-size: 1.6rem; }
    }
  </style>
</head>
<body>

<!-- Arabesque SVG shapes (decorative) -->
<svg style="display:none">
